{% extends 'core/base.html' %}

{% block title %}Upload Document{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">
                <i class="fas fa-file-upload"></i> Upload Document
            </h2>
            
            <form id="uploadForm" class="card p-4">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="titleInput" class="form-label">Document Title</label>
                    <input 
                        type="text" 
                        id="titleInput" 
                        name="title" 
                        class="form-control" 
                        placeholder="Document Title"
                        required
                    >
                    <div class="text-danger small" id="titleError"></div>
                </div>
                
                <div class="mb-3">
                    <label for="fileInput" class="form-label">Select File</label>
                    <input 
                        type="file" 
                        id="fileInput" 
                        name="file" 
                        class="form-control" 
                        accept="application/pdf,image/jpeg,image/png"
                        required
                    >
                    <small class="form-text text-muted">PDF, JPG, or PNG - max 5 MB</small>
                    <div class="text-danger small" id="fileError"></div>
                </div>

                <div id="uploadProgress" class="mb-3" style="display: none;">
                    <div class="progress">
                        <div 
                            id="progressBar" 
                            class="progress-bar progress-bar-striped progress-bar-animated" 
                            role="progressbar" 
                            style="width: 0%"
                        ></div>
                    </div>
                    <small id="progressText">Uploading...</small>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-2" id="submitBtn">
                    <i class="fas fa-cloud-upload-alt"></i> Upload
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('titleInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            // Reset errors
            document.getElementById('titleError').textContent = '';
            document.getElementById('fileError').textContent = '';
            
            // Validate
            if (!title) {
                document.getElementById('titleError').textContent = 'Document title is required.';
                return;
            }
            
            if (!file) {
                document.getElementById('fileError').textContent = 'Please select a file.';
                return;
            }
            
            // Validate file size (5 MB)
            if (file.size > 5 * 1024 * 1024) {
                document.getElementById('fileError').textContent = 'File size must not exceed 5 MB.';
                return;
            }
            
            // Validate file type
            const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png'];
            if (!allowedTypes.includes(file.type)) {
                document.getElementById('fileError').textContent = 'Only PDF, JPG, and PNG files are allowed.';
                return;
            }
            
            try {
                // Step 1: Get presigned POST data from server
                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                
                const formData = new FormData();
                formData.append('filename', file.name);
                
                const presignedResponse = await fetch('{% url "get_s3_presigned_post" %}', {
                    method: 'POST',
                    headers: {'X-CSRFToken': csrfToken},
                    body: formData,
                });
                
                if (!presignedResponse.ok) {
                    const error = await presignedResponse.json();
                    document.getElementById('fileError').textContent = error.error || 'Failed to get upload URL.';
                    return;
                }
                
                const presignedData = await presignedResponse.json();
                
                // Step 2: Upload file directly to S3 using presigned POST
                const s3FormData = new FormData();
                
                // Add fields from presigned policy
                for (const [key, value] of Object.entries(presignedData.fields)) {
                    s3FormData.append(key, value);
                }
                
                // Add file last
                s3FormData.append('file', file);
                
                // Show progress
                document.getElementById('uploadProgress').style.display = 'block';
                document.getElementById('submitBtn').disabled = true;
                
                const uploadResponse = await fetch(presignedData.url, {
                    method: 'POST',
                    body: s3FormData,
                });
                
                if (!uploadResponse.ok) {
                    throw new Error(`S3 upload failed: ${uploadResponse.status}`);
                }
                
                // Step 3: Create document record in database
                const createResponse = await fetch('{% url "create_document_record" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    body: JSON.stringify({
                        title: title,
                        file_path: presignedData.file_path,
                    }),
                });
                
                if (!createResponse.ok) {
                    const error = await createResponse.json();
                    document.getElementById('fileError').textContent = error.error || 'Failed to create document record.';
                    return;
                }
                
                // Success
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressText').textContent = 'Upload successful! Redirecting...';
                
                // Redirect after short delay
                setTimeout(() => {
                    window.location.href = '{% url "dashboard" %}';
                }, 1500);
                
            } catch (error) {
                console.error('Upload error:', error);
                document.getElementById('fileError').textContent = error.message || 'An error occurred during upload.';
                document.getElementById('uploadProgress').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
{% endblock %}
